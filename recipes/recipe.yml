---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: laptop
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: latest

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - alebastr/sway-extras
        - erikreider/SwayNotificationCenter
        - tofik/nwg-shell
        # Hyprland COPR history (builds failing since 2026-07-19):
        # - solopasha/hyprland: used until 2026-05-13, back on 2026-07-19.
        #   hyprland 0.51.1 there needs aquamarine built against libdisplay-info.so.2 (F44 ships .so.3).
        #   Pinning the F43 libdisplay-info (1a1b90c) still conflicts (aquamarine >= 0.9.2, gnome-shell).
        #   As of 2026-09-17: "Chroot not found (fedora-44-x86_64)", only rawhide left.
        # - eli-xciv/hyprland: tried 2026-05-13.
        # - lionheartp/Hyprland: 2026-05-22 -> 2026-07-18 (last green build).
        #   Broke 2026-07-19: hyprland 0.55.4 needs libaquamarine.so.11 / libhyprutils.so.12, not in the COPR.
        - solopasha/hyprland
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      packages:
        # Pinned: solopasha/hyprland's aquamarine build needs libdisplay-info.so.2,
        # but Fedora 44 ships 0.3.0 (.so.3). Install the Fedora 43 build to satisfy it.
        - https://kojipkgs.fedoraproject.org/packages/libdisplay-info/0.2.0/4.fc43/x86_64/libdisplay-info-0.2.0-4.fc43.x86_64.rpm

        # System Integration
        - gdm
        - hyprland
        - libnotify
        - qt5-qtwayland
        - qt6-qtwayland
        - python3-gobject
        - zsh

        # Desktop Applications
        - thunderbird
        - nautilus
        - evince
        - kitty
        - vim
        - gnome-system-monitor
        - keepassxc

        # Desktop Utilities
        - wlogout
        - rofi-wayland
        - SwayNotificationCenter
        - waybar
        - waypaper
        - hyprshot
        - wf-recorder
        - swappy
        - rofimoji

        # Networking
        - blueman
        - nm-connection-editor
        - network-manager-applet
        - NetworkManager-tui
        - tailscale

        # Containers & Build Tools
        - podman
        - podman-compose
        - make
        - clang

        # System Utilities
        - rsync
        - fuse
        - ImageMagick
        - udiskie

        # Device Support
        - libmtp
        - gvfs-mtp

        # audio libs
        - pipewire-jack-audio-connection-kit-devel

        # image libs
        - pango
        - pango-devel

  - type: script
    snippets:
      - "curl -L https://github.com/ReimuNotMoe/ydotool/releases/download/v1.0.4/ydotoold-release-ubuntu-latest -o /usr/bin/yodotoold"
      - "chmod +x /usr/bin/yodotoold"
      - "chmod +x /usr/bin/grub2-mkconfig-patched"

    scripts:
      - install_appimagelauncher.sh

  - type: default-flatpaks
    configurations:
      - notify: true

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.gnome.Loupe
          - org.videolan.VLC
          - org.gnome.baobab
          - com.github.tchx84.Flatseal
          - org.zotero.Zotero
          - org.gnome.Calendar

      - notify: true
        scope: user
        repo:
          url: https://mylinuxforwork.github.io/ml4w-flatpak-repo/ml4w-apps.flatpakrepo
          name: ml4w
          title: ML4W
        install:
          - com.ml4w.calendar

      - scope: user # Also add Flathub user repo, but no user packages

  - type: chezmoi
    repository: https://github.com/rambip/dotfiles

  - type: systemd
    user:
      enabled:
        - ssh-agent.service
        - udiskie.service
    system:
      enabled:
        - chronyd.service
        - grub-setup.service

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
